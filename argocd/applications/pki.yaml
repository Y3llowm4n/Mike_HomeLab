apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pki
  namespace: argocd
  labels:
    category: infra
spec:
  project: default
  source:
    repoURL: https://github.com/Y3llowm4n/Mike_HomeLab
    targetRevision: main
    path: charts/infrastructure/pki/chart
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
