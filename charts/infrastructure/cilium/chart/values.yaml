cilium:

  kubeProxyReplacement: true

  k8sServiceHost: 192.168.178.66
  k8sServicePort: 6443

  devices: enp2s0

  ipam:
    mode: kubernetes

  securityContext:
    privileged: true
  
  initContainers:
    cleanCiliumState:
      securityContext:
        privileged: true
        capabilities:
          add:
            - NET_ADMIN
            - SYS_ADMIN
            - SYS_RESOURCE
            - IPC_LOCK
            - SYS_MODULE

  bpf:
    autoMount:
      enabled: true

  cgroup:
    autoMount:
      enabled: true

  l2announcements:
    enabled: true

  gatewayAPI:
    enabled: true
  
  operator:
    replicas: 2