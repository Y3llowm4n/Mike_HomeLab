{{- range .Values.routes }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .name }}-route
  namespace: {{ .backendNamespace }}
spec:
  parentRefs:
    - name: {{ .name }}-gateway
      namespace: envoy-gateway-system
  rules:
    - backendRefs:
        - name: {{ .backendServiceName }}
          port: {{ .backendServicePort }}
      matches:
        - path:
            type: PathPrefix
            value: /
---
{{- end }}