apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-route
  namespace: argocd
spec:
  hostnames:
    - argocd.homelab
  parentRefs:
    - name: main-gateway
      namespace: envoy-gateway-system
  rules:
    - backendRefs:
        - group: ''
          name: argocd-server
          port: 80
  


  