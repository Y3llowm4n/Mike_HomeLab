vaultwarden:
  domain: "https://192.168.178.222"

  adminToken:
    existingSecret: vaultwarden-admin
    existingSecretKey: ADMIN_TOKEN

  data:
    name: "vaultwarden-data"
    size: "2Gi"
    class: "manual"
    path: "/data"

  resources:
    requests:
      cpu: 250m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
