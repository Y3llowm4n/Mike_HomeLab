image:
  repository: mikegdevops/skyblock-flipper
  tag: "0.4.1"

# Docker Hub repo is private: pull with this secret (SealedSecret in templates/dockerhub-pull-sealedsecret.yaml)
imagePullSecret: dockerhub-pull

config:
  REFRESH_SECONDS: "60"
  SALES_WINDOW_HOURS: "48"   # how far back "median sold" looks
  WATCH_PLAYERS: ""          # default names for the Flippers tab, comma separated
